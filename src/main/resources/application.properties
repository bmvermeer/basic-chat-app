quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.timeout=30s

quarkus.langchain4j.log-requests = true
quarkus.langchain4j.log-responses = false

# Default OpenAI configuration
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-3.5-turbo

# Named OpenAI configurations
quarkus.langchain4j.gpt4o.chat-model.provider=openai
quarkus.langchain4j.openai.gpt4o.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.gpt4o.chat-model.model-name=gpt-4o-mini


quarkus.langchain4j.gpt35turbo.chat-model.provider=openai
quarkus.langchain4j.openai.gpt35turbo.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.gpt35turbo.chat-model.model-name=gpt-3.5-turbo

# quarkus.langchain4j.ollama.timeout=100s

# Ollama configurations
quarkus.langchain4j.llama31.chat-model.provider=ollama
quarkus.langchain4j.ollama.llama31.timeout=100s
quarkus.langchain4j.ollama.llama31.base-url=http://localhost:11434
quarkus.langchain4j.ollama.llama31.chat-model.model-name=llama3.1


quarkus.langchain4j.llama32.chat-model.provider=ollama
quarkus.langchain4j.ollama.llama32.base-url=http://localhost:11434
quarkus.langchain4j.ollama.llama32.chat-model.model-name=llama3.2



