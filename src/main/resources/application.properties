# Named OpenAI configurations
quarkus.langchain4j.gpt4omini.chat-model.provider=openai
quarkus.langchain4j.openai.gpt4omini.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.gpt4omini.chat-model.model-name=gpt-4o-mini-2024-07-18
quarkus.langchain4j.openai.gpt4omini.timeout=60s

quarkus.langchain4j.openai.gpt4omini.chat-model.response-format=json_schema
quarkus.langchain4j.openai.gpt4omini.chat-model.strict-json-schema=true

quarkus.langchain4j.gpt41mini.chat-model.provider=openai
quarkus.langchain4j.openai.gpt41mini.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.gpt41mini.chat-model.model-name=gpt-4.1-mini-2025-04-14
quarkus.langchain4j.openai.gpt41mini.timeout=60s

quarkus.langchain4j.gpt54mini.chat-model.provider=openai
quarkus.langchain4j.openai.gpt54mini.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.gpt54mini.chat-model.model-name=gpt-5.4-mini-2026-03-17
quarkus.langchain4j.openai.gpt54mini.timeout=60s


quarkus.langchain4j.gpt35turbo.chat-model.provider=openai
quarkus.langchain4j.openai.gpt35turbo.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.gpt35turbo.chat-model.model-name=gpt-3.5-turbo-1106
quarkus.langchain4j.openai.gpt35turbo.timeout=60s

